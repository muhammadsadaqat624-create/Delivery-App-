<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karachi Delivery Pro - Baldia & Saeedabad Route</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-lg font-bold text-blue-400 flex items-center gap-2">
                🚚 Karachi Delivery Pro
            </h1>
            <p class="text-xs text-slate-400">Baldia & Saeedabad Sector Route</p>
        </div>
        <a href="https://www.zameen.com/plotfinder/Karachi-30/Baldia-Town-Sector-4E-15161/" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium flex items-center gap-1 shadow">
            📍 Plot Finder
        </a>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Scanner Section -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-semibold text-slate-300">📷 Barcode Scanner</h2>
                <button onclick="toggleScanner()" id="scanToggleBtn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1 rounded">Start Scanner</button>
            </div>
            <div id="reader" class="hidden rounded-lg overflow-hidden border border-slate-600 mb-2"></div>
        </div>

        <!-- Parcel Entry Form -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow space-y-3">
            <h2 class="text-sm font-semibold text-slate-300">📦 Parcel Details Entry</h2>
            
            <div>
                <label class="text-xs text-slate-400">Tracking ID / Number</label>
                <div class="flex gap-2 mt-1">
                    <input type="text" id="trackId" placeholder="e.g. PK-88492" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                    <button onclick="generateRandomId()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 text-xs rounded-lg text-slate-300">Auto</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs text-slate-400">Customer Name</label>
                    <input type="text" id="custName" placeholder="Customer Name" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 mt-1 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400">Phone Number</label>
                    <input type="tel" id="custPhone" placeholder="03001234567" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 mt-1 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div>
                <label class="text-xs text-slate-400">Sector / Area Zone (Karachi)</label>
                <select id="custSector" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 mt-1 focus:outline-none focus:border-blue-500">
                    <option value="">Select Area / Zone...</option>
                    <option value="Baldia Sector 4E">Baldia Town - Sector 4E</option>
                    <option value="Baldia Sector 4F">Baldia Town - Sector 4F</option>
                    <option value="Baldia Saeedabad">Baldia Town - Saeedabad</option>
                    <option value="Baldia Sector 9">Baldia Town - Sector 9</option>
                    <option value="Baldia Gulshan e Tauheed">Gulshan-e-Tauheed</option>
                    <option value="Ittehad Town">Ittehad Town</option>
                </select>
            </div>

            <div>
                <label class="text-xs text-slate-400">House / Plot Address & Plot #</label>
                <input type="text" id="custAddress" placeholder="e.g. House # 142, Street 4, Plot 1516" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 mt-1 focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="text-xs text
