<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karachi Delivery Pro - Full Route & History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-3 sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-base font-bold text-orange-400">📦 Karachi Delivery Pro</h1>
            <p id="route-status-text" class="text-xs text-slate-400">Route Hub: Not Started</p>
        </div>
        <div class="flex gap-1">
            <button onclick="toggleRouteHub()" id="route-hub-btn" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-2.5 py-1.5 rounded font-medium">Start Route</button>
            <a href="https://www.zameen.com/plotfinder/Karachi/" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1.5 rounded font-medium">📍 Map</a>
        </div>
    </header>

    <!-- Main App Container -->
    <main class="max-w-md mx-auto p-3 space-y-3 flex-grow w-full pb-20">
        <!-- Scanner Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 shadow">
            <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-300">📷 Barcode / Scanner</span>
                <button id="scan-toggle" onclick="toggleScanner()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1 rounded font-medium">Start Camera</button>
            </div>
            <div id="reader" class="hidden w-full rounded overflow-hidden mb-2"></div>
        </div>

        <!-- Entry Form -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 shadow">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">📋 Parcel Details Entry</h2>
            <form id="parcel-form" onsubmit="addParcel(event)" class="space-y-2">
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                        <label class="block text-[10px] text-slate-400 mb-1">Tracking ID</label>
                        <input type="text" id="tracking-id" required class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">&nbsp;</label>
                        <button type="button" onclick="autoGenerateID()" class="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs py-1.5 rounded font-medium border border-slate-700">Auto ID</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Customer Name</label>
                        <input type="text" id="cust-name" required placeholder="Name" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Phone Number</label>
                        <input type="tel" id="cust-phone" required placeholder="03XXXXXXXXX" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-orange-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Karachi Area / Zone</label>
                        <select id="cust-sector" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-orange-500">
                            <option value="Baldia Town">Baldia Town</option>
                            <option value="Saeedabad">Saeedabad</option>
                            <option value="Lyari">Lyari</option>
                            <option value="Orangi Town">Orangi Town</option>
                            <option value="Nazimabad">Nazimabad</option>
                            <option value="North Nazimabad">North Nazimabad</option>
                            <option value="Golimar">Golimar</option>
                            <option value="PECHS">PECHS</option>
                            <option value="Defence (DHA)">Defence (DHA)</option>
                            <option value="Clifton">Clifton</option>
                            <option value="Saddar">Saddar</option>
                            <option value="Gulshan-e-Iqbal">Gulshan-e-Iqbal</option>
                            <option value="Gulistan-e-Jauhar">Gulistan-e-Jauhar</option>
                            <option value="F.B. Area">F.B. Area</option>
                            <option value="Gulberg">Gulberg</option>
                            <option value="Korangi">Korangi</option>
                            <option value="Landhi">Landhi</option>
                            <option value="Malir">Malir</option>
                            <option value="Buffer Zone">Buffer Zone</option>
                            <option value="Other Area">Other Area</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">COD Amount (PKR)</label>
                        <input type="number" id="cod-amount" required placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-orange-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">House / Plot Address</label>
                    <input type="text" id="cust-address" required placeholder="House #, Street, Block" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-orange-500">
                </div>

                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white text-xs font-bold py-2 rounded shadow transition mt-1">➕ Add Parcel to Queue</button>
            </form>
        </div>

        <!-- Delivery Queue & Route -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 shadow space-y-2">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-300">🚀 Active Delivery Queue</span>
                <span id="parcel-count" class="text-xs bg-slate-800 px-2 py-0.5 rounded text-orange-400 font-semibold">0 Parcels</span>
            </div>
            
            <div id="queue-container" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                <p class="text-xs text-slate-500 text-center py-3">No active parcels in queue.</p>
            </div>
        </div>

        <!-- Daily Financial & Status Log -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 shadow space-y-2">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">📊 Daily Summary & Cash Log</h3>
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-slate-950 p-2 rounded border border-slate-800">
                    <span class="block text-[10px] text-slate-400">Total COD</span>
                    <span id="total-cod" class="text-xs font-bold text-emerald-400">Rs 0</span>
                </div>
                <div class="bg-slate-950 p-2 rounded border border-slate-800">
                    <span class="block text-[10px] text-slate-400">Delivered</span>
                    <span id="delivered-count" class="text-xs font-bold text-blue-400">0</span>
                </div>
                <div class="bg-slate-950 p-2 rounded border border-slate-800">
                    <span class="block text-[10px] text-slate-400">Cancelled</span>
                    <span id="cancelled-count" class="text-xs font-bold text-rose-400">0</span>
                </div>
            </div>
        </div>

        <!-- History Log Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 shadow space-y-2">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-300">📜 History Log (Past Data)</span>
                <button onclick="clearHistory()" class="text-[10px] text-rose-400 hover:underline">Clear History</button>
            </div>
            <div id="history-container" class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                <p class="text-[11px] text-slate-500 text-center py-2">No past records found.</p>
            </div>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        let parcels = JSON.parse(localStorage.getItem('delivery_parcels')) || [];
        let historyLog = JSON.parse(localStorage.getItem('delivery_history')) || [];
        let routeActive = localStorage.getItem('route_active') === 'true';
        let html5QrCode = null;

        // Init Route Hub State
        updateRouteUI();

        function toggleRouteHub() {
            routeActive = !routeActive;
            localStorage.setItem('route_active', routeActive);
            updateRouteUI();
        }

        function updateRouteUI() {
            const btn = document.getElementById('route-hub-btn');
            const txt = document.getElementById('route-status-text');
            if (routeActive) {
                btn.innerText = 'End Route';
                btn.className = 'bg-rose-600 hover:bg-rose-500 text-white text-xs px-2.5 py-1.5 rounded font-medium';
                txt.innerText = 'Route Hub: Active & Running 🚀';
            } else {
                btn.innerText = 'Start Route';
                btn.className = 'bg-amber-600 hover:bg-amber-500 text-white text-xs px-2.5 py-1.5 rounded font-medium';
                txt.innerText = 'Route Hub: Not Started';
            }
        }

        function autoGenerateID() {
            const randomNum = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('tracking-id').value = 'MS-' + randomNum;
        }

        function toggleScanner() {
            const readerDiv = document.getElementById('reader');
            const toggleBtn = document.getElementById('scan-toggle');
            
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    readerDiv.classList.add('hidden');
                    toggleBtn.innerText = 'Start Camera';
                }).catch(err => {});
            } else {
                readerDiv.classList.remove('hidden');
                toggleBtn.innerText = 'Stop Camera';
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 200, height: 100 } },
                    (decodedText) => {
                        document.getElementById('tracking-id').value = decodedText;
                        html5QrCode.stop().then(() => {
                            readerDiv.classList.add('hidden');
                            toggleBtn.innerText = 'Start Camera';
                        }).catch(err => {});
                    },
                    (error) => {}
                ).catch(err => {
                    alert("Camera access failed. Use manual or Auto ID.");
                    readerDiv.classList.add('hidden');
                    toggleBtn.innerText = 'Start Camera';
                });
            }
        }

        function addParcel(e) {
            e.preventDefault();
            const parcel = {
                id: document.getElementById('tracking-id').value,
                name: document.getElementById('cust-name').value,
                phone: document.getElementById('cust-phone').value,
                sector: document.getElementById('cust-sector').value,
                cod: parseFloat(document.getElementById('cod-amount').value) || 0,
                address: document.getElementById('cust-address').value,
                status: 'Pending',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            parcels.push(parcel);
            saveAndRender();
            document.getElementById('parcel-form').reset();
        }

        function updateStatus(index, newStatus) {
            let item = parcels.splice(index, 1)[0];
            item.status = newStatus;
            historyLog.unshift(item); // Add to top of history
            saveAndRender();
        }

        function deleteParcel(index) {
            parcels.splice(index, 1);
            saveAndRender();
        }

        function clearHistory() {
            if (confirm("Kya aap saari history clear karna chahte hain?")) {
                historyLog = [];
                localStorage.removeItem('delivery_history');
                renderQueue();
            }
        }

        function saveAndRender() {
            localStorage.setItem('delivery_parcels', JSON.stringify(parcels));
            localStorage.setItem('delivery_history', JSON.stringify(historyLog));
            renderQueue();
        }

        function renderQueue() {
            const container = document.getElementById('queue-container');
            const historyContainer = document.getElementById('history-container');
            const countBadge = document.getElementById('parcel-count');
            
            countBadge.innerText = parcels.length + ' Parcels';

            // Render Active Queue
            if (parcels.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 text-center py-3">No active parcels in queue.</p>';
            } else {
                container.innerHTML = parcels.map((p, idx) => `
                    <div class="bg-slate-950 border border-slate-800 rounded p-2 space-y-1 text-xs">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-orange-400">${p.id}</span>
                            <span class="px-2 py-0.5 rounded text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20">Pending</span>
                        </div>
                        <div>
                            <p class="font-semibold text-slate-200">${p.name} <span class="text-slate-400 font-normal">(${p.sector})</span></p>
                            <p class="text-[11px] text-slate-400 truncate">${p.address}</p>
                            <p class="text-[11px] font-bold text-emerald-400 mt-0.5">Rs ${p.cod}</p>
                        </div>
                        <div class="flex flex-wrap gap-1 pt-1 border-t border-slate-900 justify-between items-center">
                            <a href="tel:${p.phone}" class="bg-blue-600/20 text-blue-400 px-2 py-1 rounded text-[10px] font-medium hover:bg-blue-600/30">📞 Call</a>
                            <div class="space-x-1">
                                <button onclick="updateStatus(${idx}, 'Delivered')" class="bg-emerald-600/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-medium hover:bg-emerald-600/30">Confirm</button>
                                <button onclick="updateStatus(${idx}, 'Cancelled')" class="bg-rose-600/20 text-rose-400 px-2 py-1 rounded text-[10px] font-medium hover:bg-rose-600/30">Cancel</button>
                                <button onclick="deleteParcel(${idx})" class="text-slate-500 hover:text-rose-400 px-1 py-1">🗑️</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            // Render History Log & Calculations
            let totalCod = 0;
            let delivered = 0;
            let cancelled = 0;

            historyLog.forEach(h => {
                if (h.status === 'Delivered') {
                    totalCod += h.cod;
                    delivered++;
                }
                if (h.status === 'Cancelled') cancelled++;
            });

            if (historyLog.length === 0) {
                historyContainer.innerHTML = '<p class="text-[11px] text-slate-500 text-center py-2">No past records found.</p>';
            } else {
                historyContainer.innerHTML = historyLog.map(h => {
                    let badge = h.status === 'Delivered' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400';
                    return `
                        <div class="bg-slate-950 border border-slate-900 rounded p-1.5 flex justify-between items-center text-[11px]">
                            <div>
                                <span class="font-bold text-slate-300">${h.id}</span> - <span class="text-slate-400">${h.name} (${h.sector})</span>
                                <div class="text-[10px] text-emerald-400 font-semibold">Rs ${h.cod}</div>
                            </div>
                            <span class="px-1.5 py-0.5 rounded text-[9px] ${badge}">${h.status}</span>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('total-cod').innerText = 'Rs ' + totalCod;
            document.getElementById('delivered-count').innerText = delivered;
            document.getElementById('cancelled-count').innerText = cancelled;
        }

        renderQueue();
    </script>
</body>
            </html>
